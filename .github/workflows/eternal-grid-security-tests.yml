name: Tupua Eternal Grid security tests

on:
  push:
    branches:
      - "feat/tupua-eternal-grid-security-dev"
    paths:
      - "grid-core/**"
      - ".github/workflows/eternal-grid-security-tests.yml"
  pull_request:
    paths:
      - "grid-core/**"
      - ".github/workflows/eternal-grid-security-tests.yml"

permissions:
  contents: read

jobs:
  security-unit-tests:
    name: Security policy unit tests (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run policy tests
        run: node --test grid-core/*.test.mjs
